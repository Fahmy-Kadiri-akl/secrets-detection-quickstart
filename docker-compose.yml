services:
  secrets-detection:
    image: ghcr.io/fahmy-kadiri-akl/secrets_detection:latest
    container_name: secrets-detection
    ports:
      # Host-side port is configurable via the HOST_PORT env var (or a
      # .env file alongside this compose file). Container-side stays 8000.
      # Default: 8000 on the host. To use a different port:
      #   HOST_PORT=8080 docker compose up
      - "${HOST_PORT:-8000}:8000"
    environment:
      SECDET_LOG_LEVEL: INFO
    volumes:
      # Persistent SQLite database. No host mounts needed: authentication
      # is supplied at request time via a user-pasted t-token.
      - secdet-data:/data
    restart: unless-stopped

volumes:
  secdet-data:
